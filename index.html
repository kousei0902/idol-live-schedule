<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>推しスケ - ライブスケジュール管理</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

  <header class="topbar">
    <h1 class="logo">推しスケ</h1>
    <div class="topbar-actions">
      <button class="icon-btn" id="searchToggleBtn" aria-label="検索・絞り込み">
        <svg viewBox="0 0 24 24" width="22" height="22"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><line x1="21" y1="21" x2="16.65" y2="16.65" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
  </header>

  <div class="screen" id="homeScreen">
    <section class="filterbar" id="filterbar" hidden>
      <input type="search" id="searchInput" placeholder="グループ名・会場・タイトルで検索" autocomplete="off">
      <div class="chiprow" id="groupChips"></div>
    </section>

    <section class="next-live" id="nextLiveCard" hidden>
      <div class="next-live-label">次のライブまで</div>
      <div class="next-live-main">
        <span class="next-live-days" id="nextLiveDays">--</span>
        <span class="next-live-unit">日</span>
      </div>
      <div class="next-live-detail" id="nextLiveDetail"></div>
    </section>

    <nav class="tabbar" id="statusTabs">
      <button class="tab active" data-status="upcoming">予定</button>
      <button class="tab" data-status="go">参戦</button>
      <button class="tab" data-status="interested">気になる</button>
      <button class="tab" data-status="done">終了</button>
      <button class="tab" data-status="attended">行った</button>
      <button class="tab" data-status="all">すべて</button>
    </nav>

    <div class="view-toggle" id="viewToggle">
      <button type="button" class="view-toggle-btn active" data-view="list">リスト</button>
      <button type="button" class="view-toggle-btn" data-view="calendar">カレンダー</button>
    </div>

    <main class="list" id="list"></main>

    <div class="calendar-view" id="calendarView" hidden>
      <div class="calendar-nav">
        <button type="button" class="icon-btn calendar-nav-btn" id="calendarPrevBtn" aria-label="前の月">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 4 L7 12 L15 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <span class="calendar-month-label" id="calendarMonthLabel"></span>
        <button type="button" class="icon-btn calendar-nav-btn" id="calendarNextBtn" aria-label="次の月">
          <svg viewBox="0 0 24 24" width="18" height="18"><path d="M9 4 L17 12 L9 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </div>
      <div class="calendar-dow-row">
        <span>日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span>
      </div>
      <div class="calendar-grid" id="calendarGrid"></div>
      <div class="calendar-day-detail" id="calendarDayDetail"></div>
    </div>

    <p class="empty-state" id="emptyState" hidden>予定されているライブはありません。<br>右下の「+」から追加しましょう。</p>
  </div>

  <div class="screen" id="searchScreen" hidden>
    <div class="discover-filters">
      <div class="discover-search-row">
        <input type="search" id="discoverSearchInput" placeholder="グループ名で検索(例: ○○シスターズ)" autocomplete="off">
        <button type="button" class="discover-fav-toggle" id="discoverFavToggleBtn" aria-label="このグループ名をお気に入り登録">☆</button>
      </div>
      <div class="discover-fav-chips" id="discoverFavChips"></div>
      <div class="discover-date-row">
        <input type="date" id="discoverDateInput" aria-label="日付で絞り込み">
        <button type="button" class="discover-date-clear" id="discoverDateClearBtn" hidden>日付をクリア</button>
      </div>
      <select id="discoverPrefSelect" aria-label="都道府県で絞り込み">
        <option value="">すべての地域</option>
      </select>
    </div>
    <p class="discover-meta" id="discoverMeta">読み込み中...</p>
    <div class="discover-list" id="discoverList"></div>
  </div>

  <div class="screen" id="otherScreen" hidden>
    <section class="settings-section">
      <h2 class="settings-title">★ お気に入りグループ</h2>
      <div class="fav-manage-row">
        <input type="text" id="favManageInput" placeholder="グループ名を入力して追加">
        <button type="button" class="btn-primary" id="favManageAddBtn">追加</button>
      </div>
      <div class="fav-manage-list" id="favManageList"></div>
      <p class="settings-hint" id="favManageEmpty">まだお気に入りがありません。</p>
    </section>

    <section class="settings-section">
      <h2 class="settings-title">このアプリについて</h2>
      <p class="settings-hint">推しスケは、アイドル・アーティストのライブスケジュールをまとめて確認できる個人用アプリです。ホームで自分の予定を管理し、検索タブでは自動収集した数千件のライブ情報からグループ名・日付・地域で探せます。</p>
      <a class="settings-link" href="https://github.com/kousei0902/idol-live-schedule" target="_blank" rel="noopener">GitHubリポジトリを見る</a>
    </section>
  </div>

  <button class="fab" id="addBtn" aria-label="ライブを追加">＋</button>

  <nav class="bottombar" id="bottomNav">
    <button class="bottombar-btn active" data-screen="home" aria-label="ホーム">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 11 L12 4 L20 11 V20 A1 1 0 0 1 19 21 H14 V15 H10 V21 H5 A1 1 0 0 1 4 20 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <span>ホーム</span>
    </button>
    <button class="bottombar-btn" data-screen="search" aria-label="検索">
      <svg viewBox="0 0 24 24" width="22" height="22"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/></svg>
      <span>検索</span>
    </button>
    <button class="bottombar-btn" data-screen="other" aria-label="その他">
      <svg viewBox="0 0 24 24" width="22" height="22"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="2"/></svg>
      <span>その他</span>
    </button>
  </nav>

</div>

<div class="modal-overlay" id="modalOverlay" hidden>
  <div class="modal">
    <div class="modal-header">
      <h2 id="modalTitle">ライブを追加</h2>
      <button class="icon-btn" id="closeModalBtn" aria-label="閉じる">
        <svg viewBox="0 0 24 24" width="20" height="20"><line x1="5" y1="5" x2="19" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><line x1="19" y1="5" x2="5" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>

    <form id="liveForm">
      <input type="hidden" id="liveId">

      <label class="field">
        <span>グループ・アーティスト名 <em>*</em></span>
        <input type="text" id="fGroup" list="groupList" required placeholder="例: ○○シスターズ">
        <datalist id="groupList"></datalist>
      </label>

      <label class="field">
        <span>公演タイトル</span>
        <input type="text" id="fTitle" placeholder="例: 春の単独公演2026">
      </label>

      <div class="field-row">
        <label class="field">
          <span>日付 <em>*</em></span>
          <input type="date" id="fDate" required>
        </label>
        <label class="field">
          <span>開演時刻</span>
          <input type="time" id="fTime">
        </label>
      </div>

      <label class="field">
        <span>会場</span>
        <input type="text" id="fVenue" placeholder="例: 東京ドームシティホール">
      </label>

      <label class="field">
        <span>ステータス</span>
        <select id="fStatus">
          <option value="go">参戦する</option>
          <option value="interested" selected>気になる</option>
          <option value="undecided">未定</option>
        </select>
      </label>

      <label class="field">
        <span>メモ</span>
        <textarea id="fMemo" rows="3" placeholder="チケット情報、座席、持ち物など"></textarea>
      </label>

      <div class="modal-actions">
        <button type="button" class="btn-danger" id="deleteBtn" hidden>削除</button>
        <button type="submit" class="btn-primary">保存</button>
      </div>
    </form>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
